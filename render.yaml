# TrustLens AI — public evaluation deployment (Render Free plan)
#
# This Blueprint deploys the full application with no external account secrets:
# one free Docker web service (FastAPI) and one free static site (React).
# Redis, Celery workers and beat are disabled because Render has no free tier
# for them; tasks run in-process via TASK_ALWAYS_EAGER and schedules do not run.
#
# IMPORTANT: MONGODB_URI is `mongomock://`, an in-memory database. Scans work
# for anyone, but accounts, reports and rate-limit counters reset whenever the
# free service sleeps/restarts. Use a real MongoDB URI for any real launch.
#
# After the first deploy, set the API's CORS_ORIGINS to the static site's real
# URL and the static site's VITE_API_URL to the API's real URL, then redeploy.
# The placeholders below use the requested service names; Render may add a
# suffix when a name is already taken.

previews:
  generation: 'off'

envVarGroups:
  - name: trustlens-public
    envVars:
      - key: APP_NAME
        value: TrustLens AI
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '30'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '14'
      - key: CORS_ORIGINS
        value: https://trustlens-web.onrender.com
      - key: ALLOWED_HOSTS
        value: '*'
      - key: RATE_LIMIT_PER_MINUTE
        value: '120'
      - key: MONGODB_DB
        value: trustlens
      - key: MODEL_DIR
        value: /app/models
      - key: DATA_DIR
        value: /app/data
      - key: CELERY_ENABLED
        value: 'false'
      - key: TASK_ALWAYS_EAGER
        value: 'true'
      - key: SCHEDULER_ENABLED
        value: 'false'
      - key: SEED_DEMO_DATA
        value: 'false'
      - key: PAYMENT_CURRENCY
        value: INR
      - key: TURNSTILE_ENABLED
        value: 'false'
      - key: RDAP_ENABLED
        value: 'false'
      - key: DNS_ENABLED
        value: 'false'
      - key: TLS_ENABLED
        value: 'false'

services:
  # --------------------------------------------------------------------- API
  - type: web
    name: trustlens-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers'
    healthCheckPath: /health
    envVars:
      - fromGroup: trustlens-public
      - key: PORT
        value: '8000'
      - key: MONGODB_URI
        value: mongomock://

  # ---------------------------------------------------------------- Frontend
  - type: web
    name: trustlens-web
    runtime: static
    buildCommand: 'cd frontend && npm ci && npm run build'
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://trustlens-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
