# TrustLens AI — Render Blueprint (free plan)
#
# This variant uses only Render resources with a Free compute plan: one free web
# service (API) and a free static site. Render does NOT offer free background
# workers, cron jobs or Key Value with persistence, so Celery/Redis are disabled
# and tasks run in-process via TASK_ALWAYS_EAGER. Scheduled jobs do not run.
# See docs/RENDER_DEPLOYMENT.md for dashboard steps and the production variant.
#
# A free web service sleeps after ~15 minutes idle and takes ~1 minute to wake.
# This deployment is for evaluation only, not production. Free Key Value/Redis is
# in-memory only, so it is intentionally not used here.
#
# MongoDB is external (MongoDB Atlas free M0 is used for this deployment).

previews:
  generation: "off"

# Shared, non-prompted backend settings. SECRET_KEY is generated once for the
# group and used by the API.
envVarGroups:
  - name: hireshield-backend
    envVars:
      - key: APP_NAME
        value: TrustLens AI
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      # Render appended suffixes to the requested service names. Keep these in
      # sync with VITE_API_URL below if the public hosts change.
      - key: CORS_ORIGINS
        value: https://hireshield-web-j72o.onrender.com
      - key: ALLOWED_HOSTS
        value: hireshield-api-wets.onrender.com
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: MONGODB_DB
        value: hireshield
      - key: MODEL_DIR
        value: /app/models
      - key: DATA_DIR
        value: /app/data
      # Free Render has no workers, so tasks run in the web process.
      - key: CELERY_ENABLED
        value: "false"
      - key: TASK_ALWAYS_EAGER
        value: "true"
      # No Celery beat/cron on free, so scheduled monitoring never runs.
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: PAYMENT_CURRENCY
        value: INR
      - key: TURNSTILE_ENABLED
        value: "true"
      - key: RDAP_ENABLED
        value: "true"
      - key: DNS_ENABLED
        value: "true"
      - key: TLS_ENABLED
        value: "true"

services:
  # -------------------------------------------------------------------- API
  # Render web services route public traffic to the port named by PORT.
  - type: web
    name: hireshield-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers'
    healthCheckPath: /health
    envVars:
      - fromGroup: hireshield-backend
      - key: PORT
        value: "8000"
      # Render prompts for sync:false values only when the Blueprint is first
      # created. Leave Razorpay/Turnstile values blank to keep them disabled.
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # --------------------------------------------------------------- Frontend
  # Built from the repo root so staticPublishPath is unambiguous. VITE_API_URL
  # is baked into the bundle at build time; it must be the API's public URL.
  - type: web
    name: hireshield-web
    runtime: static
    buildCommand: 'cd frontend && npm ci && npm run build'
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://hireshield-api-wets.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
