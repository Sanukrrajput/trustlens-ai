# TrustLens AI — public evaluation deployment (Render Free plan)
#
# One Docker web service serves the FastAPI backend and the built React app on
# the same origin, so there is no CORS/API-URL wiring and no external database:
#   * MONGODB_URI=mongomock:// -> in-memory data; resets on restart/sleep.
#   * Celery/Redis/beat are disabled; tasks run in-process (TASK_ALWAYS_EAGER).
#   * No payment or Turnstile keys are required; those features stay disabled.
#
# This is an evaluation deployment, not a production launch. Use a real
# MongoDB URI, TLS, backups and secrets before exposing real user data.

previews:
  generation: 'off'

envVarGroups:
  - name: trustlens-public
    envVars:
      - key: APP_NAME
        value: TrustLens AI
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '30'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '14'
      - key: CORS_ORIGINS
        value: https://trustlens.onrender.com
      - key: ALLOWED_HOSTS
        value: '*'
      - key: RATE_LIMIT_PER_MINUTE
        value: '120'
      - key: MONGODB_DB
        value: trustlens
      - key: MODEL_DIR
        value: /app/models
      - key: DATA_DIR
        value: /app/data
      - key: FRONTEND_DIR
        value: /app/frontend/dist
      - key: CELERY_ENABLED
        value: 'false'
      - key: TASK_ALWAYS_EAGER
        value: 'true'
      - key: SCHEDULER_ENABLED
        value: 'false'
      - key: SEED_DEMO_DATA
        value: 'false'
      - key: PAYMENT_CURRENCY
        value: INR
      - key: TURNSTILE_ENABLED
        value: 'false'
      - key: RDAP_ENABLED
        value: 'false'
      - key: DNS_ENABLED
        value: 'false'
      - key: TLS_ENABLED
        value: 'false'

services:
  - type: web
    name: trustlens
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.fullstack
    dockerContext: .
    dockerCommand: 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers'
    healthCheckPath: /health
    envVars:
      - fromGroup: trustlens-public
      - key: PORT
        value: '8000'
      - key: MONGODB_URI
        value: mongomock://
      - key: SERVE_FRONTEND
        value: 'true'
