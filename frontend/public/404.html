<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustLens AI — Redirecting</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Store the requested
      // client-side route, then load the SPA root so React Router can handle it.
      (function () {
        var base = '/trustlens-ai/';
        var path = location.pathname || '/';
        var relative = path.indexOf(base) === 0 ? path.slice(base.length - 1) : path;
        if (!relative || relative.charAt(0) !== '/') relative = '/' + relative;
        try {
          sessionStorage.setItem('trustlens:pages-redirect', relative + location.search);
        } catch (error) { /* storage disabled — fall through to root */ }
        location.replace(base + '?p=' + encodeURIComponent(relative));
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to TrustLens AI…</p>
  </body>
</html>
